<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Dev Bhargav project journey</title>
  <desc id="desc">A progression from software development and network automation to security observability and network intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">BUILD → AUTOMATE → OBSERVE → SECURE → INTELLIGENCE</text>
  <line x1="130" y1="145" x2="1070" y2="145" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="130" cy="145" r="38" fill="#172033" stroke="#38bdf8" stroke-width="3"/><text x="130" y="151" fill="#f8fafc" font-size="16" font-weight="700">CODE</text>
    <circle cx="365" cy="145" r="38" fill="#172033" stroke="#38bdf8" stroke-width="3"/><text x="365" y="151" fill="#f8fafc" font-size="16" font-weight="700">AUTOMATE</text>
    <circle cx="600" cy="145" r="38" fill="#172033" stroke="#818cf8" stroke-width="3"/><text x="600" y="151" fill="#f8fafc" font-size="16" font-weight="700">OBSERVE</text>
    <circle cx="835" cy="145" r="38" fill="#172033" stroke="#a78bfa" stroke-width="3"/><text x="835" y="151" fill="#f8fafc" font-size="16" font-weight="700">SECURE</text>
    <circle cx="1070" cy="145" r="38" fill="#172033" stroke="#c084fc" stroke-width="3"/><text x="1070" y="151" fill="#f8fafc" font-size="16" font-weight="700">AI / ML</text>
    <text x="130" y="215" fill="#94a3b8" font-size="14">Java · Web</text>
    <text x="365" y="215" fill="#94a3b8" font-size="14">Python · Ansible</text>
    <text x="600" y="215" fill="#94a3b8" font-size="14">NetFlow · Telemetry</text>
    <text x="835" y="215" fill="#94a3b8" font-size="14">Cisco · XDR · ISE</text>
    <text x="1070" y="215" fill="#94a3b8" font-size="14">Network Intelligence</text>
  </g>
</svg>
